# ============================================================
# Mihomo.yaml —— 家里代理机 VM101（Debian mihomo）的全部分流规则
#   本文件 = rule-providers（规则集定义）+ rules（规则及顺序），VM101 本地不再写任何规则。
#   VM101 每天 04:30 随“自动更新”拉取本文件，校验通过后合并进 /etc/mihomo/config.yaml 并热重载；
#   手动立即同步：在 VM101 上执行  mihomo-rules-sync
#   节点 / proxy-groups / DNS / 端口等仍在 VM101 本地，本文件只能有 rule-providers 和 rules 两个键。
# 校验（不通过就拒绝应用、继续用上一份）：
#   - 末条必须是 MATCH；引用的策略组必须在本地存在；每个 RULE-SET 必须在 rule-providers 里有定义；
#   - PT 保护：前 5 条必须原样是 PT 直连规则（public-tracker DIRECT + PT 三个规则集 + category-pt → 🤜🏼 PT 站）。
# 修改规则：改本文件（顺序即优先级），提交前须经用户同意。
# 2026-10-28 由 Hark 从 VM101 当时线上配置原样搬入（51 个规则集、70 条规则）。
# ============================================================
